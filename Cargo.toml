[package]
name = "ssh-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Registry-driven SSH sessions over MCP stdio"
license = "MIT"
repository = "https://github.com/jyc8369/SSH_MCP"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rmcp = { version = "3.5", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63.3", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
